asyncapi: '2.6.0'
info:
  title: Order Service Events
  version: '1.0.0'
  description: События, которые генерирует и потребляет сервис заказов
  contact:
    name: Andru
    email: a@a.ru

servers:
  production:
    url: kafka://kafka.broker:9092
    protocol: kafka
    description: Брокер сообщений

channels:
  order.created:
    description: Канал для событий создания нового заказа
    publish: # Order Service публикует сюда
      message:
        name: OrderCreated
        payload:
          type: object
          required:
            - orderId
            - customerId
            - items
          properties:
            orderId:
              type: string
              description: ID заказа
            customerId:
              type: string
              description: ID клиента
            items:
              type: array
              description: Список товаров в заказе
              items:
                $ref: '#/components/schemas/ItemInOrder'

  order.cancelled:
    description: Событие отмены заказа (для разблокировки товаров на складе)
    publish:
      message:
        name: OrderCancelled
        payload:
          type: object
          required:
            - orderId
            - items
          properties:
            orderId:
              type: string
              description: ID отмененного заказа
            reason:
              type: string
              description: Причина отмены (например, "Платеж не прошел")
            items:
              type: array
              description: Список товаров, которые нужно вернуть в наличие
              items:
                $ref: '#/components/schemas/ItemInOrder'

  payment.completed:
    description: Канал для событий об успешной оплате
    subscribe: # Order Service слушает этот канал
      message:
        name: PaymentCompleted
        payload:
          type: object
          required:
            - orderId
            - status
          properties:
            orderId:
              type: string
              description: ID заказа, который был оплачен
            status:
              type: string
              enum: [SUCCESS, FAILED]
            transactionId:
              type: string

components:
  schemas:
    # Схема товара внутри события
    ItemInOrder:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Цена на момент заказа (важно для истории)